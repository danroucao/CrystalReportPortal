<div id="role-scroll-button-options" aria-labelledby="scroll-option-title">
  <style>
    #role-scroll-button-options {
      --portal-red: light-dark(#b5122a, #f27c8d);
      --portal-red-hover: light-dark(#951022, #ff9dab);
      --portal-ink: light-dark(#272525, #f4f1ed);
      --portal-muted: light-dark(#6e6a65, #c9c3bd);
      --portal-line: light-dark(#ddd8d0, #494541);
      --portal-surface: light-dark(#fffdfa, #282625);
      color: var(--portal-ink);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    #role-scroll-button-options h2 { margin: 0 0 14px; font-size: 18px; }
    #role-scroll-button-options .options { display: grid; gap: 12px; }
    #role-scroll-button-options .option {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--portal-line);
      border-radius: 10px;
      background: var(--portal-surface);
    }
    #role-scroll-button-options .option[aria-pressed="true"] {
      border-color: var(--portal-red);
      box-shadow: inset 0 0 0 1px var(--portal-red);
    }
    #role-scroll-button-options .option-label { font-weight: 700; }
    #role-scroll-button-options .option-detail { color: var(--portal-muted); font-size: 14px; }
    #role-scroll-button-options .scroll-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--portal-red);
      color: var(--portal-red);
      background: var(--portal-surface);
      font-size: 28px;
      line-height: 1;
    }
    #role-scroll-button-options .scroll-button:focus-visible,
    #role-scroll-button-options .option:focus-visible {
      outline: 3px solid var(--portal-red-hover);
      outline-offset: 2px;
    }
    #role-scroll-button-options .outline { border-radius: 50%; }
    #role-scroll-button-options .soft {
      border: 0;
      border-radius: 8px;
      color: var(--portal-red);
      background: light-dark(#fce9ec, #542e35);
    }
    #role-scroll-button-options .solid {
      border-radius: 50%;
      color: light-dark(#fff, #24191b);
      background: var(--portal-red);
      box-shadow: 0 2px 5px rgb(80 15 24 / 22%);
    }
    #role-scroll-button-options .selection { min-height: 20px; margin: 12px 0 0; color: var(--portal-muted); font-size: 14px; }
    @media (max-width: 480px) {
      #role-scroll-button-options .option { grid-template-columns: 1fr auto; }
      #role-scroll-button-options .option-detail { grid-column: 1; }
      #role-scroll-button-options .scroll-button { grid-column: 2; grid-row: 1 / span 2; }
    }
  </style>
  <h2 id="scroll-option-title">選擇右向橫向捲動按鈕</h2>
  <div class="options" role="group" aria-label="右向橫向捲動按鈕方案">
    <button type="button" class="option" data-choice="A：圓形外框" aria-pressed="false">
      <span class="option-label">方案 A</span>
      <span class="option-detail">圓形酒紅外框；最接近原畫面，輕量且不遮擋卡片。</span>
      <span class="scroll-button outline" aria-hidden="true">›</span>
    </button>
    <button type="button" class="option" data-choice="B：淡色圓角" aria-pressed="false">
      <span class="option-label">方案 B</span>
      <span class="option-detail">淡酒紅底、圓角方形；觸控範圍明確，視覺較柔和。</span>
      <span class="scroll-button soft" aria-hidden="true">›</span>
    </button>
    <button type="button" class="option" data-choice="C：實心圓形" aria-pressed="false">
      <span class="option-label">方案 C</span>
      <span class="option-detail">實心酒紅圓形；可見度最高，適合卡片內容較密的情況。</span>
      <span class="scroll-button solid" aria-hidden="true">›</span>
    </button>
  </div>
  <p class="selection" aria-live="polite">尚未選擇方案</p>
  <script>
    (() => {
      const root = document.getElementById('role-scroll-button-options');
      const options = [...root.querySelectorAll('.option')];
      const selection = root.querySelector('.selection');
      options.forEach((option) => option.addEventListener('click', () => {
        options.forEach((item) => item.setAttribute('aria-pressed', String(item === option)));
        selection.textContent = `已選擇：${option.dataset.choice}`;
        window.openai.setWidgetState({ modelContent: { selectedOption: option.dataset.choice } }).catch(() => {});
      }));
    })();
  </script>
</div>
