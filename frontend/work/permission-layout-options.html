<section id="permission-layout-options" aria-labelledby="permission-layout-title">
  <style>
    #permission-layout-options {
      --pl-ink: light-dark(#252a31, #eef1f5);
      --pl-muted: light-dark(#64707c, #aeb8c5);
      --pl-line: light-dark(#d9dfe6, #3c4754);
      --pl-surface: light-dark(#ffffff, #202731);
      --pl-soft: light-dark(#f6f8fa, #28313c);
      --pl-primary: light-dark(#165d8d, #79c6ff);
      --pl-warning: light-dark(#855b14, #f3c878);
      color: var(--pl-ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    #permission-layout-options * { box-sizing: border-box; }
    #permission-layout-options h2, #permission-layout-options h3, #permission-layout-options p { margin: 0; }
    #permission-layout-options > h2 { margin-bottom: 14px; font-size: 20px; }
    #permission-layout-options .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    #permission-layout-options .option { min-width: 0; padding: 16px; border: 1px solid var(--pl-line); border-radius: 10px; background: var(--pl-surface); }
    #permission-layout-options .option-head { display: flex; gap: 10px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--pl-line); }
    #permission-layout-options .option-id { color: var(--pl-primary); font-size: 13px; font-weight: 700; }
    #permission-layout-options h3 { font-size: 16px; }
    #permission-layout-options .modal { margin-top: 14px; padding: 14px; border: 1px solid var(--pl-line); border-radius: 8px; background: var(--pl-soft); }
    #permission-layout-options .modal-title { margin-bottom: 12px; font-size: 15px; font-weight: 700; }
    #permission-layout-options .section-label { display: block; margin: 14px 0 7px; color: var(--pl-muted); font-size: 12px; font-weight: 700; }
    #permission-layout-options .check { display: flex; gap: 7px; align-items: center; min-height: 28px; font-size: 13px; }
    #permission-layout-options input { width: 16px; height: 16px; margin: 0; accent-color: var(--pl-primary); }
    #permission-layout-options .sub { margin: 4px 0 0 23px; padding: 7px 9px; border-left: 2px solid var(--pl-line); }
    #permission-layout-options .sub p { margin: 3px 0 0 23px; color: var(--pl-muted); font-size: 11px; line-height: 1.45; }
    #permission-layout-options .is-disabled { color: var(--pl-muted); }
    #permission-layout-options .is-disabled .hint { color: var(--pl-warning); }
    #permission-layout-options .category-card { margin-top: 8px; padding: 9px; border: 1px solid var(--pl-line); border-radius: 6px; background: var(--pl-surface); }
    #permission-layout-options .category-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
    #permission-layout-options .dependency { color: var(--pl-muted); font-size: 11px; font-weight: 400; white-space: nowrap; }
    #permission-layout-options .permission-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 7px 0 0 23px; padding-left: 9px; border-left: 2px solid var(--pl-line); }
    #permission-layout-options .permission-row .check { min-height: 22px; font-size: 12px; }
    #permission-layout-options .permission-row input { width: 14px; height: 14px; }
    #permission-layout-options .table { margin-top: 8px; border: 1px solid var(--pl-line); border-radius: 6px; overflow: hidden; background: var(--pl-surface); }
    #permission-layout-options .tr { display: grid; grid-template-columns: minmax(100px, 1fr) 58px 58px 58px; align-items: center; min-height: 38px; border-top: 1px solid var(--pl-line); font-size: 12px; }
    #permission-layout-options .tr:first-child { border-top: 0; color: var(--pl-muted); background: var(--pl-soft); font-weight: 700; }
    #permission-layout-options .cell { padding: 6px 8px; text-align: center; }
    #permission-layout-options .cell:first-child { text-align: left; }
    #permission-layout-options .branch { padding: 4px 8px 4px 19px; color: var(--pl-muted); font-size: 11px; }
    #permission-layout-options .branch strong { color: var(--pl-ink); font-size: 12px; }
    #permission-layout-options .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; color: var(--pl-muted); font-size: 11px; }
    #permission-layout-options .chip { padding: 2px 6px; border-radius: 999px; background: light-dark(#e8f3fb, #28465b); color: var(--pl-primary); }
    #permission-layout-options .compact-tree { margin-top: 8px; border-left: 2px solid var(--pl-line); }
    #permission-layout-options .tree-node { padding: 7px 0 7px 12px; border-bottom: 1px solid var(--pl-line); }
    #permission-layout-options .tree-node:last-child { border-bottom: 0; }
    #permission-layout-options .tree-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 6px 0 0 23px; }
    #permission-layout-options .tree-actions .check { font-size: 11px; }
    @media (max-width: 760px) { #permission-layout-options .options { grid-template-columns: 1fr; } }
  </style>

  <h2 id="permission-layout-title">角色權限版型比較</h2>
  <div class="options">
    <article class="option" aria-labelledby="option-a-title">
      <div class="option-head"><span class="option-id">方案 A</span><h3 id="option-a-title">分組卡片</h3></div>
      <div class="modal">
        <p class="modal-title">編輯角色｜財務人員</p>
        <span class="section-label">功能權限</span>
        <label class="check"><input type="checkbox" checked />資料庫連線管理</label>
        <div class="category-card">
          <label class="check"><input type="checkbox" checked />報表管理</label>
          <div class="sub"><label class="check"><input type="checkbox" checked />檢視已封存表單資料</label><p>僅可檢視，無法修改、刪除或還原。</p></div>
        </div>
        <div class="category-card">
          <label class="check"><input type="checkbox" checked />操作紀錄查詢</label>
          <div class="sub"><label class="check"><input type="checkbox" disabled />檢視已封存操作紀錄</label><p class="is-disabled"><span class="hint">需先啟用「操作紀錄查詢」。</span></p></div>
        </div>
        <span class="section-label">報表分類權限</span>
        <div class="category-card"><div class="category-title">財務報表 <span class="dependency">閱覽為母權限</span></div><label class="check"><input type="checkbox" checked />閱覽</label><div class="permission-row"><label class="check"><input type="checkbox" checked />匯出</label><label class="check"><input type="checkbox" checked />列印</label></div></div>
      </div>
    </article>

    <article class="option" aria-labelledby="option-b-title">
      <div class="option-head"><span class="option-id">方案 B</span><h3 id="option-b-title">權限矩陣＋關係標記</h3></div>
      <div class="modal">
        <p class="modal-title">編輯角色｜財務人員</p>
        <span class="section-label">功能權限</span>
        <label class="check"><input type="checkbox" checked />報表管理</label>
        <div class="sub"><label class="check"><input type="checkbox" checked />└ 檢視已封存表單資料</label><p>僅可檢視封存資料</p></div>
        <label class="check"><input type="checkbox" checked />操作紀錄查詢</label>
        <div class="sub"><label class="check"><input type="checkbox" checked />└ 檢視已封存操作紀錄</label><p>僅可檢視封存紀錄</p></div>
        <span class="section-label">報表分類權限</span>
        <div class="table" role="table" aria-label="報表分類權限矩陣">
          <div class="tr" role="row"><div class="cell" role="columnheader">分類</div><div class="cell" role="columnheader">閱覽</div><div class="cell" role="columnheader">匯出</div><div class="cell" role="columnheader">列印</div></div>
          <div class="tr" role="row"><div class="cell">財務報表<br /><span class="branch">└ 匯出／列印從屬於閱覽</span></div><div class="cell"><input type="checkbox" checked aria-label="財務報表閱覽" /></div><div class="cell"><input type="checkbox" checked aria-label="財務報表匯出" /></div><div class="cell"><input type="checkbox" checked aria-label="財務報表列印" /></div></div>
          <div class="tr" role="row"><div class="cell">採購報表<br /><span class="branch">└ 先啟用閱覽</span></div><div class="cell"><input type="checkbox" aria-label="採購報表閱覽" /></div><div class="cell"><input type="checkbox" disabled aria-label="採購報表匯出" /></div><div class="cell"><input type="checkbox" disabled aria-label="採購報表列印" /></div></div>
        </div>
      </div>
    </article>

    <article class="option" aria-labelledby="option-c-title">
      <div class="option-head"><span class="option-id">方案 C</span><h3 id="option-c-title">全樹狀權限清單</h3></div>
      <div class="modal">
        <p class="modal-title">編輯角色｜財務人員</p>
        <span class="section-label">功能權限</span>
        <div class="compact-tree">
          <div class="tree-node"><label class="check"><input type="checkbox" checked />報表管理</label><div class="sub"><label class="check"><input type="checkbox" checked />檢視已封存表單資料</label><p>唯讀</p></div></div>
          <div class="tree-node"><label class="check"><input type="checkbox" checked />操作紀錄查詢</label><div class="sub"><label class="check"><input type="checkbox" checked />檢視已封存操作紀錄</label><p>唯讀</p></div></div>
        </div>
        <span class="section-label">報表分類權限</span>
        <div class="compact-tree">
          <div class="tree-node"><label class="check"><input type="checkbox" checked />財務報表｜閱覽</label><div class="tree-actions"><label class="check"><input type="checkbox" checked />匯出</label><label class="check"><input type="checkbox" checked />列印</label></div></div>
          <div class="tree-node"><label class="check"><input type="checkbox" />採購報表｜閱覽</label><div class="tree-actions is-disabled"><label class="check"><input type="checkbox" disabled />匯出</label><label class="check"><input type="checkbox" disabled />列印</label></div></div>
        </div>
        <div class="legend"><span class="chip">母權限</span><span>未啟用母權限時，子權限不可授予</span></div>
      </div>
    </article>
  </div>
</section>
