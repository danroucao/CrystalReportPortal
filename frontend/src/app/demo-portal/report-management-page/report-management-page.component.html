<nav class="management-tabs" aria-label="報表管理功能">
  <button type="button" [class.is-active]="ActiveManagementTab === 'reports'"
    [attr.aria-current]="ActiveManagementTab === 'reports' ? 'page' : null"
    (click)="ActiveManagementTab = 'reports'">報表管理</button>
  <button type="button" [class.is-active]="ActiveManagementTab === 'common-parameters'"
    [attr.aria-current]="ActiveManagementTab === 'common-parameters' ? 'page' : null"
    (click)="ActiveManagementTab = 'common-parameters'">常用參數</button>
</nav>

<app-common-parameter-template-page *ngIf="ActiveManagementTab === 'common-parameters'" />
<app-managed-report-page *ngIf="ActiveManagementTab === 'reports'" />
