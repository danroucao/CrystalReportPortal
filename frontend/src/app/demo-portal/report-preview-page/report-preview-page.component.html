<section *ngIf="Auth.SelectedReport as Report" class="content-card">
  <div class="preview-report-summary">
    <div>
      <p class="selected-parameter-report-label">目前預覽報表</p>
      <h2>{{ Report.ReportName }}</h2>
    </div>
    <dl><div><dt>報表分類</dt><dd>{{ Report.CategoryName }}</dd></div></dl>
  </div>

  <div *ngIf="IsPreviewLoading" class="preview-placeholder" role="status">正在產生報表預覽… {{ PreviewProgressLabel }}</div>

  <div *ngIf="PreviewError" class="preview-error" role="alert">
    <p>{{ PreviewError }}</p>
    <button type="button" class="secondary-button" [disabled]="IsPreviewLoading" (click)="RetryPreview()">重新產生預覽</button>
  </div>

  <section *ngIf="HasPreview && !IsPreviewLoading" class="report-image-preview" aria-label="報表影像預覽">
    <p class="report-image-preview__notice">預覽僅提供檢視；下載與列印須分別具備對應權限。</p>
    <div class="report-image-preview__toolbar">
      <div class="report-image-preview__pagination">
        <button type="button" class="secondary-button" (click)="GoToPreviousPreviewPage()" [disabled]="CurrentPreviewPageIndex === 0">上一頁</button>
        <span>第 {{ CurrentPreviewPageIndex + 1 }} / {{ PreviewPageUrls.length }} 頁</span>
        <button type="button" class="secondary-button" (click)="GoToNextPreviewPage()" [disabled]="CurrentPreviewPageIndex === PreviewPageUrls.length - 1">下一頁</button>
      </div>
      <div class="report-image-preview__zoom">
        <button type="button" class="secondary-button" (click)="ZoomPreview(-10)" [disabled]="PreviewZoom <= 60">−</button>
        <button type="button" class="secondary-button" (click)="ResetPreviewZoom()">{{ PreviewZoom }}%</button>
        <button type="button" class="secondary-button" (click)="ZoomPreview(10)" [disabled]="PreviewZoom >= 175">＋</button>
      </div>
    </div>
    <figure *ngIf="CurrentPreviewPageUrl" class="report-image-preview__page" [style.width.%]="PreviewZoom">
      <img [src]="CurrentPreviewPageUrl" [alt]="Report.ReportName + ' 第 ' + (CurrentPreviewPageIndex + 1) + ' 頁'" />
      <figcaption>第 {{ CurrentPreviewPageIndex + 1 }} 頁</figcaption>
    </figure>
  </section>

  <div class="preview-output-bar">
    <button type="button" class="secondary-button preview-return-button" (click)="ReturnToReportList()">{{ ReportPreviewReturnLabel }}</button>
    <div *ngIf="HasPreview && !IsPreviewLoading" class="output-actions">
      <button *ngIf="Auth.SelectedReportCategoryPermission.CanExport" type="button" class="secondary-button preview-output-action" (click)="DownloadPdf()">下載 PDF</button>
      <button *ngIf="Auth.SelectedReportCategoryPermission.CanPrint" type="button" class="secondary-button preview-output-action" (click)="PrintPdf()">列印報表</button>
    </div>
  </div>

  <p *ngIf="PreviewNotice" class="mock-notice" role="status" aria-live="polite">{{ PreviewNotice }}</p>
</section>
