<aside
  id="mobile-portal-navigation"
  class="portal-nav"
  [class.is-drawer-open]="IsDrawerOpen"
  [attr.inert]="IsNavigationInert ? '' : null"
  [attr.aria-hidden]="IsNavigationInert ? 'true' : null"
  [attr.role]="IsCompactLayout ? 'dialog' : null"
  [attr.aria-modal]="IsCompactLayout ? 'true' : null"
  aria-label="系統導覽"
  (click)="HandleNavigationClick($event)"
>
  <section *ngIf="IsCompactLayout" class="mobile-navigation-profile">
    <div class="mobile-navigation-profile-heading">
      <div class="mobile-navigation-identity">
        <ngx-boring-avatar
          *ngIf="Auth.CurrentIdentity as User"
          variant="beam"
          [name]="User.Account"
          [size]="48"
        />
        <div>
          <strong>{{ Auth.DisplayName }}</strong>
          <span>{{ Auth.CurrentIdentity?.Account }}</span>
        </div>
      </div>
      <button
        #drawerCloseButton
        type="button"
        class="mobile-navigation-close"
        aria-label="關閉導覽選單"
        (click)="RequestClose()"
      >
        ×
      </button>
    </div>
  </section>

  <ng-container *ngIf="Auth.IsFrontOffice">
    <p class="nav-group-title">一般功能</p>
    <a routerLink="/reports/parameters" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v5h5M9 13h6M9 17h6" /></svg>
      <span>所有報表</span>
    </a>
    <a routerLink="/reports" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9z" /></svg>
      <span>收藏的報表</span>
    </a>
    <a routerLink="/notification-center" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
      <span>通知中心</span>
      <span *ngIf="NotificationBadgeCount" class="mobile-navigation-badge">{{ NotificationBadgeCount }}</span>
    </a>
    <p
      *ngIf="Auth.HasManagementPermission('DatabaseConnection') || Auth.HasManagementPermission('RptManagement') || Auth.HasManagementPermission('OperationLog')"
      class="nav-group-title"
    >管理功能</p>
    <a *ngIf="Auth.HasManagementPermission('DatabaseConnection')" routerLink="/database-connections" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3" /><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7" /></svg>
      <span>MSSQL 資料庫連線管理</span>
    </a>
    <a *ngIf="Auth.HasManagementPermission('RptManagement')" routerLink="/report-management" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
      <span>報表管理</span>
    </a>
    <a *ngIf="Auth.HasManagementPermission('OperationLog')" routerLink="/operation-logs" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2" /></svg>
      <span>操作紀錄查詢</span>
    </a>
  </ng-container>

  <ng-container *ngIf="Auth.IsBackOffice">
    <p class="nav-group-title">系統設定</p>
    <a routerLink="/admin/users" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0" /></svg>
      <span>使用者管理</span>
    </a>
    <a routerLink="/admin/notification-center" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
      <span>通知中心</span>
    </a>
  </ng-container>

  <button *ngIf="IsCompactLayout" type="button" class="mobile-navigation-logout" (click)="RequestLogout()">登出</button>
</aside>
