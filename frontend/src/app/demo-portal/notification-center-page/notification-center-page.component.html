<section class="content-card notification-center-page">
  <app-portal-tabs
    [Tabs]="Tabs"
    [ActiveTab]="ActiveTab"
    AriaLabel="通知中心頁籤"
    (TabChange)="TabChange.emit($event)"
  />

  <ng-container *ngIf="ActiveTab === 'All' || ActiveTab === 'Unread'">
    <div *ngIf="Notifications.length" class="notification-center-list">
      <article
        *ngFor="let Item of PagedNotifications; trackBy: TrackNotificationById"
        class="center-item"
        [class.is-unread]="!Item.ReadAt"
        tabindex="0"
        role="button"
        [attr.aria-label]="'查看通知詳細資訊：' + Item.Title"
        (click)="NotificationOpen.emit(Item)"
        (keydown.enter)="NotificationOpen.emit(Item)"
        (keydown.space)="NotificationOpen.emit(Item); $event.preventDefault()"
      >
        <div>
          <h2>{{ Item.Title }}</h2>
          <p class="notification-center-summary">{{ Item.Summary }}</p>
        </div>
        <time>{{ Item.CreatedAt | date: 'short' }}</time>
      </article>
    </div>
    <app-portal-pagination
      *ngIf="Notifications.length"
      [CurrentPage]="CurrentPage"
      [TotalPages]="TotalPages"
      [PageNumbers]="PageNumbers"
      AriaLabel="通知中心分頁"
      (PageChange)="PageChange.emit($event)"
    />
    <section *ngIf="!Notifications.length" class="notification-empty-state" role="status">
      <div class="notification-empty-illustration" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <path d="M25 34a15 15 0 0 1 30 0c0 17 7 17 7 21H18c0-4 7-4 7-21Z" />
          <path d="M34 63h12M26 23l-5-5M54 23l5-5M18 35h-7M62 35h7" />
          <path d="M25 55v9h30v-9" />
        </svg>
      </div>
      <h2>{{ ActiveTab === 'Unread' ? '目前沒有未讀通知' : '目前沒有通知' }}</h2>
      <p>{{ ActiveTab === 'Unread' ? '已讀通知會保留在「全部」頁籤中。' : '新的系統通知與權限提醒會顯示在這裡。' }}</p>
    </section>
  </ng-container>
</section>
